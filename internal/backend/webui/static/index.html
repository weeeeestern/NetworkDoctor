          <rect width="128" height="128" rx="30" fill="var(--accent)"/>
          <path d="M64 32v64M32 64h64" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
          <g fill="#fff">
            <circle cx="64" cy="64" r="11"/>
            <circle cx="64" cy="28" r="9"/>
            <circle cx="64" cy="100" r="9"/>
            <circle cx="28" cy="64" r="9"/>

      <nav>

  <script src="/app.js"></script>
