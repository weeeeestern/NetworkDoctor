<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NetworkDoctor logo samples</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  section { padding: 36px 48px; }
  .dark { background: #0b0f1f; color: #e8ebf5; }
  .light { background: #f3f4f8; color: #1f2430; }
  h2 { font-size: 14px; font-weight: 600; opacity: .6; margin: 0 0 20px; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; gap: 56px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; }
  figure img { width: 96px; height: 96px; display: block; margin: 0 auto; }
  figcaption { font-size: 12.5px; margin-top: 10px; opacity: .7; }
  .lockup { display: flex; align-items: center; gap: 12px; margin-top: 28px; }
  .lockup img { width: 34px; height: 34px; }
  .lockup span { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .small { display: flex; gap: 20px; align-items: center; margin-top: 18px; }
  .small img { width: 20px; height: 20px; }
  .small em { font-size: 12px; font-style: normal; opacity: .6; }
</style>
</head>
<body>
<section class="dark">
  <h2>Dark background (dashboard)</h2>
  <div class="row">
    <figure><img src="01-node-cross.svg"><figcaption>1 · Node Cross<br>네트워크 노드로 그린 의료 십자</figcaption></figure>
    <figure><img src="02-pulse-node.svg"><figcaption>2 · Pulse Node<br>노드 사이 링크의 심전도</figcaption></figure>
    <figure><img src="03-stethoscope-node.svg"><figcaption>3 · Stethoscope Node<br>노드를 청진하는 청진기</figcaption></figure>
    <figure><img src="04-shield-pulse.svg"><figcaption>4 · Shield Pulse<br>건강하게 지키는 네트워크</figcaption></figure>
  </div>
  <div class="lockup"><img src="01-node-cross.svg"><span>NetworkDoctor</span></div>
  <div class="small">
    <img src="01-node-cross.svg"><img src="02-pulse-node.svg"><img src="03-stethoscope-node.svg"><img src="04-shield-pulse.svg">
    <em>↑ 파비콘/사이드바 크기(20px) 가독성 체크</em>
  </div>
</section>
<section class="light">
  <h2>Light background (PDF report, README)</h2>
  <div class="row">
    <figure><img src="01-node-cross.svg"><figcaption>1 · Node Cross</figcaption></figure>
    <figure><img src="02-pulse-node.svg"><figcaption>2 · Pulse Node</figcaption></figure>
    <figure><img src="03-stethoscope-node.svg"><figcaption>3 · Stethoscope Node</figcaption></figure>
    <figure><img src="04-shield-pulse.svg"><figcaption>4 · Shield Pulse</figcaption></figure>
  </div>
  <div class="lockup"><img src="01-node-cross.svg"><span>NetworkDoctor</span></div>
</section>
</body>
</html>
