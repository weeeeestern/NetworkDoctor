<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- NetworkDoctor logo concept 1: "node cross"
       A medical cross drawn as a network graph — five nodes joined by links. -->
  <rect width="128" height="128" rx="30" fill="#3f6df5"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M64 32v64M32 64h64"/>
  </g>
  <g fill="#ffffff">
    <circle cx="64" cy="64" r="11"/>
    <circle cx="64" cy="28" r="9"/>
    <circle cx="64" cy="100" r="9"/>
    <circle cx="28" cy="64" r="9"/>
    <circle cx="100" cy="64" r="9"/>
  </g>
  <g fill="#3f6df5">
    <circle cx="64" cy="64" r="5"/>
  </g>
</svg>
