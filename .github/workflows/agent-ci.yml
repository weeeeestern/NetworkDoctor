name: agent-ci

# PR / main validation for the node agent (eBPF + Go).
# Everything here needs a Linux runner: the Go packages are //go:build linux
# gated and the eBPF program is compiled with clang.

on:
  pull_request:
    paths:
      - "bpf/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "build/agent/**"
      - ".github/workflows/agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "bpf/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "build/agent/**"
      - ".github/workflows/agent-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev bpftool

      - name: Ensure vmlinux.h
        run: |
          if [ ! -f bpf/vmlinux.h ]; then
            echo "bpf/vmlinux.h not committed; generating from runner BTF"
            sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi

      - name: Generate eBPF bindings
        run: go generate ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/networkdoctor-agent

      - name: Test
        run: go test ./...
