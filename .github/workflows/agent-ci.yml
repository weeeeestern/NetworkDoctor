name: agent-ci

# PR / main validation for the node agent (eBPF + Go).
# Everything here needs a Linux runner: the Go packages are //go:build linux
# gated and the eBPF program is compiled with clang.
#
# The workflow triggers on every PR (no workflow-level paths filter). A
# `changes` job decides whether the agent was actually touched; `build` is
# skipped otherwise. This avoids the branch-protection deadlock where a
# path-filtered required check stays pending forever on unrelated PRs.
# Mark `build` as the required status check — a skipped job counts as success.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent:
              - 'bpf/**'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'build/agent/**'
              - '.github/workflows/agent-ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Generate eBPF bindings
        run: go generate ./...

      - name: gofmt
        run: |
          # git ls-files excludes the gitignored generated bindings, so this
          # only checks hand-written source.
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/networkdoctor-agent

      - name: Test
        run: go test ./...

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate image build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/agent/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
