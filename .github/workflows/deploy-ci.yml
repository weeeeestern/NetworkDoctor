name: deploy-ci

# Validates the deployment assets: Helm chart lint/render across the value
# combinations that matter, plus promtool on the rule file. Path-filtered at
# the job level (not workflow level) for the same branch-protection reason
# documented in agent-ci.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'deploy/**'
              - 'skills/**'
              - '.github/workflows/deploy-ci.yml'

  helm:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/networkdoctor
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: helm lint (defaults)
        run: helm lint "$CHART"

      - name: helm lint (lab values)
        run: helm lint "$CHART" -f "$CHART/values-onprem-lab.yaml"

      - name: helm lint + template (bootstrap root chart)
        run: |
          helm lint deploy/bootstrap -f deploy/bootstrap/onprem-lab.yaml
          helm template root deploy/bootstrap -f deploy/bootstrap/onprem-lab.yaml > /tmp/root.yaml
          [ "$(grep -c '^kind: Application' /tmp/root.yaml)" -ge 2 ]
          ! grep -q 'automated' /tmp/root.yaml

      - name: helm lint + template (holmesgpt chart)
        run: |
          helm lint deploy/helm/holmesgpt -f deploy/helm/holmesgpt/values-onprem-lab.yaml
          helm template h deploy/helm/holmesgpt -n holmesgpt -f deploy/helm/holmesgpt/values-onprem-lab.yaml > /tmp/holmes.yaml
          grep -q 'CUSTOM_SKILL_PATHS' /tmp/holmes.yaml
          grep -q 'name: holmes-llm' /tmp/holmes.yaml

      - name: skills have the common output schema
        run: |
          for f in skills/*/SKILL.md; do
            for k in rule_id scenario investigation_status affected_resources time_window root_cause confidence trigger_evidence supporting_evidence excluded_alternatives recommended_actions additional_checks; do
              grep -q "^$k:" "$f" || { echo "$f missing $k"; exit 1; }
            done
          done

      - name: helm lint + template (demo chart)
        run: |
          helm lint deploy/helm/networkdoctor-demo
          helm template demo deploy/helm/networkdoctor-demo -n networkdoctor-demo | grep -q 'kind: ServiceMonitor'

      - name: helm template variants
        run: |
          set -euo pipefail
          helm template nd "$CHART" -n networkdoctor > /tmp/default.yaml
          helm template nd "$CHART" -n networkdoctor \
            --set serviceMonitor.enabled=true --set prometheusRule.enabled=true \
            --set serviceMonitor.labels.release=kps --set prometheusRule.labels.release=kps \
            --set alertmanagerConfig.enabled=true \
            > /tmp/operator.yaml
          helm template nd "$CHART" -n networkdoctor \
            --set ruleConfigMap.enabled=true --set agent.hostNetwork=false \
            --set agent.privileged=false --set backend.persistence.enabled=true \
            > /tmp/fallback.yaml
          grep -q 'kind: ServiceMonitor' /tmp/operator.yaml
          grep -q 'kind: PrometheusRule' /tmp/operator.yaml
          [ "$(grep -c 'rule_id: rule-' /tmp/operator.yaml)" -eq 8 ]
          grep -q 'kind: AlertmanagerConfig' /tmp/operator.yaml
          ! grep -q 'kind: AlertmanagerConfig' /tmp/default.yaml
          grep -q 'kind: ConfigMap' /tmp/fallback.yaml
          grep -q 'kind: PersistentVolumeClaim' /tmp/fallback.yaml
          ! grep -q 'kind: ServiceMonitor' /tmp/default.yaml

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD:/work" --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules /work/$CHART/rules/networkdoctor-smoke-rules.yaml /work/$CHART/rules/networkdoctor-scenario-rules.yaml

  deploy-ci-gate:
    needs: [changes, helm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "changes=${{ needs.changes.result }} helm=${{ needs.helm.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          r="${{ needs.helm.result }}"
          [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
