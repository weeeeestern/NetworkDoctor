name: agent-image

# Build and push the node agent image to Docker Hub.
# Runs on main pushes and on version tags. Pull requests are intentionally
# excluded so registry credentials are never exposed to fork PRs.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account / namespace
#   DOCKERHUB_TOKEN     Docker Hub access token (not the account password)

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure vmlinux.h
        run: |
          if [ ! -f bpf/vmlinux.h ]; then
            echo "bpf/vmlinux.h not committed; generating from runner BTF"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bpftool
            sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > bpf/vmlinux.h
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/networkdoctor-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
