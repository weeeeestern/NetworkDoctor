name: agent-image

# Build and push the node agent image to Docker Hub.
# Runs on main pushes and on version tags. Pull requests are intentionally
# excluded so registry credentials are never exposed to fork PRs; the image
# build itself is validated (without push) in agent-ci.
#
# Tagging convention:
#   main push  -> edge, main-<sha>   (latest dev build)
#   v1.2.3 tag -> 1.2.3, 1.2, latest (releases; latest is release-only)
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account / namespace (e.g. 7910trio)
#   DOCKERHUB_TOKEN     Docker Hub personal access token (Read & Write)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only agent sources. Without this filter every push (docs, charts) rebuilt
    # an identical agent image, and with CI-pinned tags that would roll the
    # eBPF DaemonSet on every node for no reason.
    paths:
      - "bpf/**"
      - "cmd/networkdoctor-agent/**"
      - "internal/app/**"
      - "internal/bpf/**"
      - "internal/config/**"
      - "internal/metrics/**"
      - "internal/model/**"
      - "internal/worker/**"
      - "build/agent/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agent-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # bump-lab-image.sh pushes the pinned tag to main
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/networkdoctor-agent
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the lab to the image just pushed (main only, not release tags).
      - name: Pin lab values to main-<sha>
        if: github.ref == 'refs/heads/main'
        run: .github/scripts/bump-lab-image.sh agent-image "main-${GITHUB_SHA::7}"
