# On-prem lab environment: which child Applications the root app creates.
#
# Adding a chart under deploy/helm/ is not enough to deploy it; it must also be
# listed here (same rule as the company bootstrap). The root Application
# (deploy/argocd/root-application.yaml) renders this file.

env: onprem-lab
project: default

spec:
  destination:
    # In-cluster Argo CD deploys to its own cluster.
    server: https://kubernetes.default.svc

source:
  repoURL: https://github.com/weeeeestern/NetworkDoctor.git
  targetRevision: main

# Empty on purpose: no `automated:` block, so every child Application is
# manual-sync. The root app itself is also manual (see root-application.yaml).
syncPolicy: {}

applications:
  # Lab-only storage. The on-prem lab has no StorageClass, so PVCs stay
  # Pending. This installs Rancher local-path-provisioner (Apache-2.0) straight
  # from its upstream Git chart and makes `local-path` the default class.
  # Customer clusters bring their own storage; the NetworkDoctor chart never
  # installs a provisioner (it only creates a PVC).
  - name: local-path-provisioner
    namespace: local-path-storage
    repoURL: https://github.com/rancher/local-path-provisioner.git
    targetRevision: v0.0.37
    path: deploy/chart/local-path-provisioner
    values:
      storageClass:
        defaultClass: true
        name: local-path
        reclaimPolicy: Delete
      nodePathMap:
        - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
          paths:
            - /opt/local-path-provisioner

  # eBPF agent DaemonSet + backend + Prometheus/Alertmanager wiring
  - name: networkdoctor
    namespace: networkdoctor
    valueFiles:
      - values-onprem-lab.yaml

  # Cat Shop (podinfo) demo workload + fortio load
  - name: networkdoctor-demo
    namespace: networkdoctor-demo

  # HolmesGPT RCA agent. Needs Secret holmes-llm (LLM_GATEWAY_KEY) in the
  # namespace before the first sync; see deploy/helm/holmesgpt/README.md.
  - name: holmesgpt
    namespace: holmesgpt
    valueFiles:
      - values-onprem-lab.yaml
