# Kubernetes Gateway API resources for NetworkDoctor on EKS.
#
# Prerequisites (in order):
#   1. terraform apply                      — cluster + ALB controller + ACM cert
#   2. Gateway API CRDs (standard channel):
#        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#   3. Fill the certificate ARN below, then apply:
#        CERT_ARN=$(terraform -chdir=deploy/terraform/envs/eks-lab output -raw acm_certificate_arn)
#        sed "s|ACM_CERT_ARN|$CERT_ARN|" deploy/terraform/k8s/gateway.yaml | kubectl apply -f -
#
# The AWS Load Balancer Controller provisions an internet-facing ALB from the
# Gateway below, and external-dns writes netdoc.cloud -> ALB into Route53.
# NOTE: the HTTPS listener has no `tls` block on purpose — the controller does
# not support `certificateRefs` and takes the cert from LoadBalancerConfiguration
# instead (and `tls.mode: Terminate` without certificateRefs fails CRD validation).
#
# Exposure policy (public demo, no auth in the backend):
#   - HTTP :80 only redirects to HTTPS (no cleartext serving).
#   - /webhooks/* and /eval/* are NOT reachable publicly (redirected to /):
#     Alertmanager posts to the in-cluster Service URL and eval runs are an
#     operator action, so neither needs internet exposure, and both trigger
#     paid LLM work if left open.
#   - Residual risk: the UI's own mutation endpoints (e.g. POST
#     /incidents/*/holmes) stay public so the demo works. To close that too,
#     uncomment sourceRanges below and allowlist your IPs.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: alb
spec:
  controllerName: gateway.k8s.aws/alb
---
# Controller-specific knobs for the provisioned ALB: internet-facing scheme
# and the ACM certificate for the HTTPS:443 listener.
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: networkdoctor
  namespace: networkdoctor
spec:
  scheme: internet-facing
  # Optional IP allowlist for the whole ALB (demo lockdown):
  # sourceRanges:
  #   - "203.0.113.0/24"   # e.g. campus / home IP
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: ACM_CERT_ARN
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: networkdoctor
  namespace: networkdoctor
spec:
  gatewayClassName: alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: networkdoctor
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
---
# HTTP :80 — redirect everything to HTTPS; nothing is served in cleartext.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: networkdoctor-redirect
  namespace: networkdoctor
spec:
  parentRefs:
    - name: networkdoctor
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: networkdoctor-backend
  namespace: networkdoctor
spec:
  parentRefs:
    - name: networkdoctor
      sectionName: https
  # external-dns reads this hostname to create the Route53 record. Requests
  # hitting the raw ALB DNS name no longer match this route (404) — use the
  # domain.
  hostnames:
    - netdoc.cloud
  rules:
    # Block the write endpoints that must never be public (longest-prefix
    # match wins over the / rule below): Alertmanager webhooks arrive via the
    # in-cluster Service, and evals are operator-only. Both spend LLM money
    # if exposed.
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks
        - path:
            type: PathPrefix
            value: /eval
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    # Web UI at / and the read API (/incidents, ...) — everything else goes
    # to the backend.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: networkdoctor-backend
          port: 8080
