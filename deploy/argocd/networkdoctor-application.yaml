# Argo CD Application for the on-prem lab.
#
# Manual sync by design: there is no `syncPolicy.automated` block, so nothing
# reaches the cluster until a person presses Sync (UI) or runs `argocd app sync`.
# Argo CD still refreshes and shows OutOfSync/diff on every Git change.
#
# targetRevision is `main`: only merged code is ever deployable. Test a branch
# by temporarily pointing this at the branch name, then put it back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networkdoctor
  namespace: argocd
  finalizers:
    # Deleting the Application also deletes the resources it created.
    # Remove this line if you want `kubectl delete application` to leave them.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/weeeeestern/NetworkDoctor.git
    targetRevision: main
    path: deploy/helm/networkdoctor
    helm:
      releaseName: networkdoctor
      valueFiles:
        - values-onprem-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: networkdoctor
  syncPolicy:
    # No `automated:` here on purpose (manual sync only).
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply keeps large objects (DaemonSet with many fields) from
      # hitting the last-applied-configuration annotation size limit and gives
      # clearer conflict errors.
      - ServerSideApply=true
