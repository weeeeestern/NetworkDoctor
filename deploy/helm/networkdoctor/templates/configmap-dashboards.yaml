{{- if .Values.grafanaDashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
# Grafana dashboard ConfigMaps, one per JSON file under dashboards/.
# Picked up by the grafana sidecar (kube-prometheus-stack enables it by
# default) via the label below. The JSON files are generated by
# scripts/grafana/gen_dashboards.py; edit the generator, not the JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dash-%s" (include "networkdoctor.fullname" $) (base $path | trimSuffix ".json") | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Values.grafanaDashboards.namespace | default $.Release.Namespace }}
  labels:
    {{- include "networkdoctor.labels" $ | nindent 4 }}
    {{ $.Values.grafanaDashboards.sidecarLabel }}: {{ $.Values.grafanaDashboards.sidecarLabelValue | quote }}
  annotations:
    {{ $.Values.grafanaDashboards.folderAnnotation }}: {{ $.Values.grafanaDashboards.folder | quote }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
