{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "networkdoctor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "networkdoctor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither the agent nor the backend talks to the Kubernetes API today, so no
# token is mounted and no RBAC is granted. Add a ClusterRole when that changes.
automountServiceAccountToken: false
{{- end }}
