{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "networkdoctor.agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "networkdoctor.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "networkdoctor.agent.selectorLabels" . | nindent 6 }}
  {{- with .Values.agent.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "networkdoctor.agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.agent.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "networkdoctor.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.agent.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostNetwork is what makes `-iface` resolve to the host NIC. See
      # values.yaml (agent.hostNetwork) for the netlink/netns reasoning.
      hostNetwork: {{ .Values.agent.hostNetwork }}
      {{- if .Values.agent.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.agent.terminationGracePeriodSeconds }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            - -iface={{ .Values.agent.iface }}
            - -listen=:{{ .Values.agent.port }}
            - -metrics-path={{ .Values.agent.metricsPath }}
            {{- range $flag, $value := .Values.agent.thresholds }}
            - -{{ $flag }}={{ $value }}
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.agent.metricsPath }}
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: {{ .Values.agent.metricsPath }}
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            {{- if .Values.agent.privileged }}
            privileged: true
            {{- else }}
            privileged: false
            allowPrivilegeEscalation: true
            capabilities:
              add:
                {{- toYaml .Values.agent.capabilities | nindent 16 }}
            {{- end }}
            # The image runs as uid 0 on purpose (see build/agent/Dockerfile):
            # Kubernetes has no ambient capabilities, so a non-root process
            # cannot make added caps effective and bpf() would EPERM.
            runAsUser: 0
            readOnlyRootFilesystem: true
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.agent.mounts.btf }}
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            {{- end }}
            {{- if .Values.agent.mounts.bpffs }}
            - name: bpffs
              mountPath: /sys/fs/bpf
            {{- end }}
            {{- if .Values.agent.mounts.debugfs }}
            - name: debugfs
              mountPath: /sys/kernel/debug
            {{- end }}
      volumes:
        {{- if .Values.agent.mounts.btf }}
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        {{- end }}
        {{- if .Values.agent.mounts.bpffs }}
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.agent.mounts.debugfs }}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        {{- end }}
{{- end }}
