{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "networkdoctor.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "networkdoctor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # The file store is single-writer; never run two replicas against one
  # volume. Recreate avoids a brief two-pod overlap during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "networkdoctor.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "networkdoctor.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "networkdoctor.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: ND_LISTEN
              value: ":{{ .Values.backend.service.port }}"
            - name: ND_DATA_DIR
              value: {{ .Values.backend.dataDir | quote }}
            - name: ND_CLUSTER_NAME
              value: {{ .Values.global.clusterName | quote }}
            - name: ND_PROMETHEUS_URL
              value: {{ .Values.backend.config.prometheusURL | quote }}
            - name: ND_HOLMES_URL
              value: {{ .Values.backend.config.holmesURL | quote }}
            - name: ND_HOLMES_MODEL
              value: {{ .Values.backend.config.holmesModel | quote }}
            - name: ND_EVAL_HOLMES_MODEL
              value: {{ .Values.backend.config.evalHolmesModel | quote }}
            - name: ND_HOLMES_TIMEOUT
              value: {{ .Values.backend.config.holmesTimeout | quote }}
            - name: ND_HOLMES_AUTO
              value: {{ .Values.backend.config.holmesAuto | quote }}
            - name: ND_HOLMES_SKIP_RULE_PREFIXES
              value: {{ .Values.backend.config.holmesSkipRulePrefixes | quote }}
            - name: ND_WORKERS
              value: {{ .Values.backend.config.workers | quote }}
            - name: ND_CORRELATION_WINDOW
              value: {{ .Values.backend.config.correlationWindow | quote }}
            - name: ND_GROUP_WAIT
              value: {{ .Values.backend.config.groupWait | quote }}
            - name: ND_EVIDENCE_WINDOW
              value: {{ .Values.backend.config.evidenceWindow | quote }}
            - name: ND_MAX_BODY_BYTES
              value: {{ .Values.backend.config.maxBodyBytes | quote }}
            - name: ND_ARCH
              value: {{ .Values.backend.config.arch | default "baseline" | quote }}
            {{- with .Values.backend.jev }}
            {{- if .enabled }}
            - name: ND_JEV_MODEL
              value: {{ .model | default "jev-latest" | quote }}
            - name: JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .secretKey | default "JEV_API_KEY" | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.backend.dataDir }}
      volumes:
        - name: data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.persistence.existingClaim | default (include "networkdoctor.backend.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
