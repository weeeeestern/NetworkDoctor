# On-prem lab overrides (k8s-cp-01 + worker01..03).
# Filled from the 2026-09-28 Phase 0 discovery; see docs/deploy-onprem.md §0.
global:
  clusterName: onprem-lab

agent:
  # Verified via node-exporter node_network_up: all three workers use eno1 (1 GbE).
  # The control plane VM uses ens18 and is tainted node-role.kubernetes.io/control-plane.
  # The chart default tolerates every taint, which would schedule the agent there
  # and fail on "find interface eno1". Drop the tolerations so the taint keeps it
  # on the workers only.
  iface: eno1
  hostNetwork: true
  privileged: true
  tolerations: []

# kube-prometheus-stack 84.5.0 in ns monitoring. Both selectors are
# `release: prometheus-stack` with no namespace restriction.
serviceMonitor:
  enabled: true
  labels:
    release: prometheus-stack
prometheusRule:
  enabled: true
  labels:
    release: prometheus-stack
ruleConfigMap:
  enabled: false

# Alertmanager CR selector is {} (all AlertmanagerConfigs), so no labels needed.
alertmanagerConfig:
  enabled: true

backend:
  # docker.io/7910trio/networkdoctor-backend:edge exists since the PR #13
  # merge (backend-image.yml on main push, 2026-09-28).
  enabled: true
  image:
    # The lab tracks the moving `edge` tag; Always makes each rollout pull the
    # latest main build instead of a node-cached one.
    pullPolicy: Always
  config:
    prometheusURL: http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090
    # HolmesGPT child app (deploy/helm/holmesgpt), Service holmesgpt-holmes:80.
    holmesURL: http://holmesgpt-holmes.holmesgpt.svc:80
    holmesModel: gateway-luna
    # Rule 1-8 scenario rules exist (rules/networkdoctor-scenario-rules.yaml),
    # so smoke alerts go back to pipeline-only: chart default "smoke-".
  persistence:
    # Lab storage comes from the local-path-provisioner child app (default
    # StorageClass `local-path`). storageClass is left empty on purpose so the
    # chart follows whatever default class a cluster has.
    enabled: true
    size: 1Gi
