# NetworkDoctor smoke-test alert rules (Phase 3A).
#
# These rules exist to prove the end-to-end path
#   agent metric -> Prometheus -> rule -> Alertmanager -> backend webhook -> incident
# using ONLY metrics the agent exports today. They are NOT the production
# Rule 1-8 scenarios; those need node-exporter / CoreDNS / Cilium / app metrics
# that must be confirmed in Prometheus first.
#
# Label contract consumed downstream:
#   source="networkdoctor"  -> Alertmanager route matcher
#   rule_id, scenario       -> backend incident classification
#   node                    -> added by the ServiceMonitor relabeling
#                              (pod node name); falls back to instance
#
# This file is the single source for both the PrometheusRule CR and the
# ConfigMap fallback rendered by the Helm chart. Validate with:
#   promtool check rules deploy/helm/networkdoctor/rules/networkdoctor-smoke-rules.yaml
groups:
  - name: networkdoctor.smoke
    rules:
      - alert: NetworkDoctorAgentDown
        expr: up{job=~".*networkdoctor-agent.*"} == 0
        for: 5m
        labels:
          severity: warning
          source: networkdoctor
          rule_id: smoke-0
          scenario: smoke-agent-down
        annotations:
          summary: "{{ if $labels.node }}{{ $labels.node }}{{ else }}{{ $labels.instance }}{{ end }}의 NetworkDoctor 에이전트 수집 실패"
          description: "Prometheus가 5분째 {{ $labels.instance }}의 NetworkDoctor 에이전트를 수집하지 못함."

      - alert: NetworkDoctorTCPRetransmitBurstHigh
        # Any retransmit burst in the last 5m. Bursts are already thresholded
        # in the kernel program (retrans-burst / retrans-window flags).
        expr: increase(ebpf_tcp_retransmit_bursts_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          source: networkdoctor
          rule_id: smoke-1
          scenario: smoke-tcp-retransmit-burst
        annotations:
          summary: "{{ if $labels.node }}{{ $labels.node }}{{ else }}{{ $labels.instance }}{{ end }}에서 TCP 재전송 버스트"
          description: "최근 5분 동안 {{ $labels.instance }}에서 TCP 재전송 버스트 {{ $value | printf \"%.0f\" }}회."

      - alert: NetworkDoctorTCPConnectFailuresHigh
        expr: increase(ebpf_tcp_connect_failed_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
          source: networkdoctor
          rule_id: smoke-2
          scenario: smoke-tcp-connect-failures
        annotations:
          summary: "{{ if $labels.node }}{{ $labels.node }}{{ else }}{{ $labels.instance }}{{ end }}에서 TCP 연결 실패"
          description: "최근 5분 동안 {{ $labels.instance }}에서 TCP 연결 실패 {{ $value | printf \"%.0f\" }}회."

      - alert: NetworkDoctorDNSSlowHigh
        expr: increase(ebpf_dns_slow_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
          source: networkdoctor
          rule_id: smoke-3
          scenario: smoke-dns-slow
        annotations:
          summary: "{{ if $labels.node }}{{ $labels.node }}{{ else }}{{ $labels.instance }}{{ end }}에서 DNS 응답 지연"
          description: "최근 5분 동안 {{ $labels.instance }}에서 에이전트 기준보다 느린 DNS 응답 {{ $value | printf \"%.0f\" }}건."

      - alert: NetworkDoctorDNSRcodeErrorsHigh
        expr: increase(ebpf_dns_rcode_errors_total[5m]) > 20
        for: 2m
        labels:
          severity: warning
          source: networkdoctor
          rule_id: smoke-4
          scenario: smoke-dns-rcode-errors
        annotations:
          summary: "{{ if $labels.node }}{{ $labels.node }}{{ else }}{{ $labels.instance }}{{ end }}에서 DNS 오류 응답"
          description: "최근 5분 동안 {{ $labels.instance }}에서 rcode가 0이 아닌 DNS 응답 {{ $value | printf \"%.0f\" }}건."

      # NetworkDoctorRunqueueLatencyHigh is intentionally NOT enabled yet.
      # The agent exports ebpf_runqlat as a Prometheus histogram built from
      # log2 buckets (ebpf_runqlat_bucket / _sum / _count, le = 2^n
      # microseconds). Confirm the bucket shape in Prometheus before adding:
      #   histogram_quantile(0.99, sum by (le, instance) (rate(ebpf_runqlat_bucket[5m]))) > 10000
