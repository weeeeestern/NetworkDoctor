apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
    {{- range .Values.models }}
      - model_name: {{ .name }}
        litellm_params:
          model: bedrock/{{ .bedrockModel }}
          aws_region_name: {{ $.Values.aws.region }}
    {{- end }}

    litellm_settings:
      drop_params: true
      num_retries: 2
      request_timeout: 120

    {{- with .Values.fallbacks }}
    router_settings:
      fallbacks:
      {{- range $model, $to := . }}
        - {{ $model }}: {{ toJson $to }}
      {{- end }}
    {{- end }}

    # No database_url: no virtual keys, no admin UI, no spend tables.
    # Clients authenticate with the master key.
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
