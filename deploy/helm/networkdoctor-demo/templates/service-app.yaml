apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo.app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
    {{- include "demo.app.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "demo.app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.ports.http }}
      targetPort: http
      {{- if and (eq .Values.app.service.type "NodePort") .Values.app.service.nodePort }}
      nodePort: {{ .Values.app.service.nodePort }}
      {{- end }}
    - name: http-metrics
      port: {{ .Values.app.ports.metrics }}
      targetPort: http-metrics
    - name: grpc
      port: {{ .Values.app.ports.grpc }}
      targetPort: grpc
