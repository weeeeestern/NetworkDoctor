# The Gateway Terraform creates (deploy/terraform/envs/eks-lab/gateway.tf).
# Its listener only admits routes from the networkdoctor and monitoring
# namespaces.
gateway:
  name: lab
  namespace: gateway

# Must match the Terraform `domain` variable. external-dns writes
# Route53 aliases from the route hostnames. An empty host uses the zone apex.
domain: netdoc.cloud

# One HTTPRoute + TargetGroupConfiguration per entry, created in the
# Service's own namespace (that namespace's Argo app must be synced first).
#   methods  limit the route to these HTTP methods; empty = all methods
routes:
  # Read-only from the internet; changes go through port-forward (README).
  - name: networkdoctor
    host: ""
    namespace: networkdoctor
    service: networkdoctor-backend
    port: 8080
    healthCheckPath: /healthz
    methods: [GET, HEAD]

  # Grafana logs in and queries with POST, so all methods are allowed. The
  # ALB is open to the internet; Grafana's own login is the only gate.
  - name: grafana
    host: grafana
    namespace: monitoring
    service: monitoring-grafana
    port: 80
    healthCheckPath: /api/health

  # No HolmesGPT route: it is an API (POST /api/chat) that only the backend
  # calls, and its CiliumNetworkPolicy admits nothing else. Use port-forward.
