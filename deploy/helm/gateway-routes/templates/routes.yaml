{{- range .Values.routes }}
{{- if ne .enabled false }}
{{- $hostname := $.Values.domain }}
{{- with .host }}
{{- $hostname = printf "%s.%s" . $hostname }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/part-of: networkdoctor
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        {{- range (.methods | default (list "")) }}
        - path:
            type: PathPrefix
            value: /
          {{- with . }}
          method: {{ . }}
          {{- end }}
        {{- end }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
---
# IP targets: the ALB sends traffic straight to pod IPs, so the Service can
# stay ClusterIP (no NodePort).
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: {{ .service }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/part-of: networkdoctor
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  targetReference:
    name: {{ .service }}
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckPath: {{ .healthCheckPath }}
{{- end }}
{{- end }}
